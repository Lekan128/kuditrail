# Cloudflare Pages configuration for KudiTrail.
# The D1 database_id is filled in after `npx wrangler d1 create kuditrail`.
name = "kuditrail"
pages_build_output_dir = "public"
compatibility_date = "2026-11-01"

[vars]
CONTACT_EMAIL = "corrections@kuditrail.example"
GITHUB_REPO = "Lekan128/kuditrail"

[[d1_databases]]
binding = "DB"
database_name = "kuditrail"
database_id = "1ca3bfdd-cc00-4b1b-9255-17c3dea23002"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "kuditrail-photos"
