# Cloudflare Worker configuration for KudiTrail.
# Cloudflare builds with `npm run build` and deploys with `npx wrangler deploy`.
name = "kuditrail"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true   # serve at kuditrail.<subdomain>.workers.dev

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[observability]
enabled = true

[vars]
CONTACT_EMAIL = "corrections@kuditrail.example"
GITHUB_REPO = "Lekan128/kuditrail"

[[d1_databases]]
binding = "DB"
database_name = "kuditrail"
database_id = "1ca3bfdd-cc00-4b1b-9255-17c3dea23002"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "kuditrail-photos"
