# Applies new D1 database migrations (migrations/*.sql) whenever they change
# on main. Wrangler records which migrations have run, so each runs only once.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (with D1 Edit permission)
# and CLOUDFLARE_ACCOUNT_ID.
name: Migrate database

on:
  push:
    branches: [main]
    paths: ['migrations/**', 'wrangler.toml']
  workflow_dispatch: {}

concurrency:
  group: migrate-db
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx wrangler d1 migrations apply kuditrail --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
